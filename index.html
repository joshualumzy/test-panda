<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh | AI Engineer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lenis@1.0.45/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;400;900&family=Geist+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #050505; --accent: #3b82f6; }
        body { background: var(--bg); color: #fff; margin: 0; overflow-x: hidden; font-family: 'Geist', sans-serif; }

        /* HERO - Absolute Centering Fix */
        #hero { 
            height: 100vh; width: 100%; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            text-align: center;
        }
        .cursor { display: inline-block; width: 2px; height: 0.9em; background: #fff; margin-left: 5px; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .big-name { font-size: 8vw; font-weight: 900; letter-spacing: -0.05em; line-height: 1; text-transform: uppercase; }
        .tagline { font-size: 1.25rem; font-weight: 100; color: rgba(255,255,255,0.4); margin-top: 1.5rem; letter-spacing: 0.05em; }

        /* 01. IDEAS VS REALITY */
        .reality-pop { color: var(--accent); font-family: 'Geist Mono', monospace; font-weight: 700; text-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }

        /* JOURNEY CARDS - Keep White Hover */
        .journey-card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 1.5rem; 
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .journey-card:hover { background: #fff; color: #000; border-color: #fff; }
        .journey-card:hover .circle-logo { background: #000; border-color: #000; }
        .journey-card:hover .circle-logo svg { fill: #fff; }

        /* CIRCLE LOGO BASE */
        .circle-logo { 
            width: 64px; height: 64px; border-radius: 50%; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; 
            transition: all 0.4s ease; flex-shrink: 0; overflow: hidden;
        }
        .circle-logo svg { width: 32px; height: 32px; fill: #fff; transition: all 0.4s ease; }

        /* 05. TOOLS - NO WHITE BOX HOVER FIX */
        .tool-item { display: flex; align-items: center; gap: 1.5rem; }
        .tool-item:hover .circle-logo { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        .tool-item:hover span { color: var(--accent); opacity: 1; }
        
        html.lenis { height: auto; }
    </style>
</head>
<body>

    <nav class="fixed top-0 w-full p-8 flex justify-between items-center z-[100] mix-blend-difference">
        <span class="font-black text-2xl tracking-tighter uppercase">Josh.AI</span>
    </nav>

    <section id="hero">
        <h1 class="big-name">
            <span class="opacity-10 mr-4 font-light">></span><span id="typewriter"></span><span class="cursor"></span>
        </h1>
        <p class="tagline opacity-0" id="tagline">
            Building with intention, learning at the speed of <span class="text-white font-normal italic">thought.</span>
        </p>
    </section>

    <main class="max-w-6xl mx-auto px-8 space-y-64 pb-64 relative z-10">
        
        <section id="about" class="reveal">
            <div class="grid md:grid-cols-2 gap-16 items-start">
                <div>
                    <h2 class="text-[10px] font-bold tracking-[0.5em] text-slate-500 mb-8 uppercase">01. Architect</h2>
                    <p class="text-5xl md:text-7xl font-black leading-[0.9] tracking-tighter uppercase text-white">Mapping<br>The Latent<br>Space.</p>
                </div>
                <div class="pt-2 md:pt-20">
                    <p class="text-2xl text-slate-400 font-light leading-relaxed">
                        I focus on engineering AI solutions that bridge the gap between 
                        <span class="font-extralight italic opacity-30">ideas</span> 
                        and <span class="reality-pop ml-1">reality</span>.
                    </p>
                </div>
            </div>
        </section>

        <section id="tools" class="reveal">
            <h2 class="text-[10px] font-bold tracking-[0.5em] text-slate-500 mb-12 uppercase">05. Tools</h2>
            <div class="flex flex-row items-center gap-16">
                
                <div class="tool-item">
                    <div class="circle-logo w-20 h-20">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 24C5.373 24 0 18.627 0 12S5.373 0 12 0s12 5.373 12 12-5.373 12-12 12zm0-22.316c-5.7 0-10.316 4.616-10.316 10.316S6.3 22.316 12 22.316s10.316-4.616 10.316-10.316S17.7 1.684 12 1.684zm0 16.516c-3.441 0-6.232-2.791-6.232-6.232 0-3.441 2.791-6.232 6.232-6.232 3.441 0 6.232 2.791 6.232 6.232 0 3.441-2.791 6.232-6.232 6.232zm.032-9.711c-.563 0-1.019.456-1.019 1.019s.456 1.019 1.019 1.019c.563 0 1.019-.456 1.019-1.019s-.456-1.019-1.019-1.019zm-.032 7.194c.328 0 .594-.266.594-.594V10.8c0-.328-.266-.594-.594-.594-.328 0-.594.266-.594.594v4.287c0 .328.266.594.594.594z"/>
                        </svg>
                    </div>
                    <span class="text-xs font-bold tracking-[0.3em] opacity-20 uppercase">PyTorch</span>
                </div>

                <div class="tool-item">
                    <div class="circle-logo w-20 h-20">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.017 11.396a.44.44 0 0 0-.44-.44h-5.228l-2.028-4.908a.44.44 0 0 0-.814 0l-2.028 4.908H6.248a.44.44 0 0 0-.44.44c0 .243.197.44.44.44h4.862l-3.328 8.05a.44.44 0 1 0 .814 0l3.328-8.05 3.328 8.05a.44.44 0 1 0 .814 0l3.328-8.05h4.633a.44.44 0 0 0 .44-.44zm-9.577 3.491l-1.928-4.664h3.856l-1.928 4.664z"/>
                        </svg>
                    </div>
                    <span class="text-xs font-bold tracking-[0.3em] opacity-20 uppercase">MySQL</span>
                </div>
            </div>
        </section>

    </main>

    <script>
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        const text = "HI, I'M JOSH.";
        let i = 0;
        function type() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++;
                setTimeout(type, 100);
            } else {
                gsap.to("#tagline", { opacity: 1, y: -20, duration: 1, ease: "power2.out" });
            }
        }
        window.onload = type;

        gsap.registerPlugin(ScrollTrigger);
        gsap.to("#hero", {
            scrollTrigger: { trigger: "#hero", start: "top top", end: "bottom top", scrub: true },
            opacity: 0, y: -50, scale: 0.98
        });

        document.querySelectorAll('.reveal').forEach(section => {
            gsap.from(section, {
                scrollTrigger: { trigger: section, start: "top 85%" },
                y: 40, opacity: 0, duration: 1.2, ease: "power4.out"
            });
        });
    </script>
</body>
</html>
