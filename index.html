<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh | Liquid Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100;400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
        }
        body {
            font-family: 'Geist', sans-serif;
            background-color: var(--bg-color);
            overflow-x: hidden;
            color: #0f172a;
        }

        /* 1. INTERACTIVE CANVAS BACKGROUND */
        #fluid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.5;
            filter: blur(40px);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.04);
        }

        /* 2. LIQUID BUTTON EFFECT */
        .liquid-btn {
            position: relative;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1);
        }
        .liquid-btn:hover {
            transform: scale(1.05) translateY(-5px);
        }
        .btn-glow {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(59,130,246,0.6) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 50%;
            mix-blend-mode: soft-light;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
            opacity: 0;
        }
        .liquid-btn:hover .btn-glow {
            opacity: 1;
        }

        /* 3. HERO TEXT DYNAMICS */
        .char {
            display: inline-block;
            animation: drift 8s ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2px, -4px) rotate(1deg); }
            66% { transform: translate(-2px, 2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <canvas id="fluid-canvas"></canvas>

    <section class="min-h-screen flex flex-col justify-center px-6 md:px-24 select-none">
        <div id="hero-title">
            <h1 class="text-7xl md:text-[13rem] font-black tracking-tighter leading-[0.8] mb-8">
                <span class="char" style="animation-delay: 0s">H</span><span class="char" style="animation-delay: 0.2s">i</span><span class="char" style="animation-delay: 0.4s">!</span><br>
                <span class="char" style="animation-delay: 0.6s">I</span><span class="char" style="animation-delay: 0.8s">'</span><span class="char" style="animation-delay: 1s">m</span> 
                <span class="text-blue-600 char" style="animation-delay: 1.2s">J</span><span class="text-blue-600 char" style="animation-delay: 1.4s">o</span><span class="text-blue-600 char" style="animation-delay: 1.6s">s</span><span class="text-blue-600 char" style="animation-delay: 1.8s">h</span><span class="text-blue-600 char" style="animation-delay: 2s">.</span>
            </h1>
            <p class="text-2xl md:text-4xl font-light text-slate-400 max-w-3xl leading-tight">
                Crafting <span class="text-slate-900 font-medium">high-velocity</span> experiences that feel weightless.
            </p>
        </div>
    </section>

    <main class="max-w-6xl mx-auto space-y-60 pb-60 px-6">
        
        <section class="reveal">
            <div class="glass-card p-12 rounded-[4rem] grid md:grid-cols-2 gap-16 items-center">
                <div class="rounded-[3rem] overflow-hidden aspect-[4/5]">
                    <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&q=80&w=800" class="w-full h-full object-cover grayscale hover:grayscale-0 transition duration-1000 scale-105 hover:scale-100">
                </div>
                <div>
                    <h3 class="text-xs font-black uppercase tracking-[0.5em] text-blue-500 mb-8">Synthesis</h3>
                    <p class="text-4xl font-light leading-tight text-slate-800">
                        I build at the intersection of <span class="italic">art and physics</span>. Every interaction is an opportunity to surprise.
                    </p>
                </div>
            </div>
        </section>

        <section class="reveal">
            <h3 class="text-xs font-black uppercase tracking-[0.5em] text-slate-400 mb-12">The Loop</h3>
            <div class="space-y-4">
                <div class="group glass-card px-10 py-8 rounded-3xl flex items-center justify-between hover:bg-white/80 transition-all cursor-crosshair">
                    <span class="text-2xl font-bold">2026 — Present</span>
                    <span class="text-slate-400 group-hover:text-blue-600 transition-colors">Digital Architect</span>
                </div>
                <div class="group glass-card px-10 py-8 rounded-3xl flex items-center justify-between hover:bg-white/80 transition-all cursor-crosshair">
                    <span class="text-2xl font-bold">2023 — 2025</span>
                    <span class="text-slate-400 group-hover:text-blue-600 transition-colors">Experience Design</span>
                </div>
            </div>
        </section>

        <section class="reveal text-center">
            <h2 class="text-3xl font-light mb-12 text-slate-400">Ready to move?</h2>
            <a href="https://linkedin.com" class="liquid-btn inline-block px-16 py-8 bg-slate-900 text-white rounded-full text-3xl font-black shadow-2xl">
                <div class="btn-glow" id="btn-glow"></div>
                CONNECT
            </a>
        </section>

    </main>

    <script>
        // --- 1. DYNAMIC MESH BACKGROUND (The "Antigravity" Flow) ---
        const canvas = document.getElementById('fluid-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 400 + 400,
                    color: i % 2 === 0 ? '#dbeafe' : '#fee2e2'
                });
            }
        }

        let mouse = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            
            // Move button glow
            const btn = document.querySelector('.liquid-btn');
            const glow = document.getElementById('btn-glow');
            const rect = btn.getBoundingClientRect();
            glow.style.left = `${e.clientX - rect.left}px`;
            glow.style.top = `${e.clientY - rect.top}px`;
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                // Gentle bounce
                if (p.x < -200 || p.x > width + 200) p.vx *= -1;
                if (p.y < -200 || p.y > height + 200) p.vy *= -1;

                // Mouse influence
                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 600) {
                    p.x -= dx * 0.01;
                    p.y -= dy * 0.01;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        animate();

        // --- 2. REVEAL ANIMATIONS ---
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = "1";
                    entry.target.style.transform = "translateY(0px) scale(1)";
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => {
            el.style.opacity = "0";
            el.style.transform = "translateY(60px) scale(0.98)";
            el.style.transition = "all 1.4s cubic-bezier(0.16, 1, 0.3, 1)";
            observer.observe(el);
        });
    </script>
</body>
</html>
